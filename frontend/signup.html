<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Alumni Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">Alumni Portal</div>
  <div><a href="login.html">Login</a></div>
</nav>

<div class="container">
  <div class="card">
    <h2>Create your account</h2>
    <form id="signupForm">
      <div>
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" minlength="8" required>
      </div>
      <div>
        <label>I am a</label>
        <select id="role">
          <option value="STUDENT">Student</option>
          <option value="ALUMNI">Alumni</option>
        </select>
      </div>
      <p class="error" id="errorMsg"></p>
      <button type="submit">Sign Up</button>
    </form>
    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.textContent = "";

  try {
    const data = await apiRequest("/auth/signup", "POST", {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      role: document.getElementById("role").value,
    });
    setSession(data.token, data.name, data.role);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorMsg.textContent = err.message;
  }
});
</script>

</body>
</html>
