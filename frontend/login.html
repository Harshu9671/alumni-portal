<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Alumni Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand">Alumni Portal</div>
  <div><a href="signup.html">Sign Up</a></div>
</nav>

<div class="container">
  <div class="card">
    <h2>Log in</h2>
    <form id="loginForm">
      <div>
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <p class="error" id="errorMsg"></p>
      <button type="submit">Log In</button>
    </form>
    <p class="muted">New here? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.textContent = "";

  try {
    const data = await apiRequest("/auth/login", "POST", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    setSession(data.token, data.name, data.role);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorMsg.textContent = err.message;
  }
});
</script>

</body>
</html>
