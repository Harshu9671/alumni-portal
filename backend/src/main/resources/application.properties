# --- Server ---
server.port=8080

# --- Database (RDS MySQL) ---
# Set these as environment variables on the EC2 instance — never commit real values
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/alumni_portal
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Generate a strong random secret, store in env var / AWS Secrets Manager
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- AWS S3 (profile pictures) ---
aws.s3.bucket=${S3_BUCKET_NAME}
aws.region=${AWS_REGION:us-east-1}
